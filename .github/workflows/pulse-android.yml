name: Build Pulse APK

# Produces a sideloadable Android APK and attaches it to the run as a
# downloadable artifact. GitHub's Ubuntu runners ship the Android SDK, NDK and
# build-tools preinstalled, which is what makes this work without any local
# toolchain setup.
#
# Run it from the Actions tab ("Run workflow"), then download "pulse-apk" from
# the finished run's Artifacts section.

on:
  workflow_dispatch:
  push:
    branches: [claude/pulse-fitness-app-8pbmjk]
    paths:
      - 'pulse/app/**'
      - '.github/workflows/pulse-android.yml'

jobs:
  build:
    name: Assemble release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: pulse/app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pulse/app/package-lock.json

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The android/ directory is generated, not committed, so it is rebuilt
      # from app.json on every run.
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pulse/app/android/**/*.gradle*', 'pulse/app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # The first run failed here: the Gradle wrapper gave up downloading its
      # distribution after its default 10s connect timeout. This reports
      # whether the host is actually reachable (just slow) or blocked outright,
      # and what Gradle the runner already has, so the fallback below is chosen
      # on evidence rather than guesswork.
      - name: Diagnose Gradle availability
        continue-on-error: true
        run: |
          echo "--- preinstalled gradle ---"
          which gradle && gradle --version 2>&1 | head -6 || echo "no preinstalled gradle"
          echo "--- services.gradle.org reachability (60s budget) ---"
          curl -sS -o /dev/null -L --max-time 60 \
            -w 'http=%{http_code} connect=%{time_connect}s total=%{time_total}s size=%{size_download}\n' \
            -r 0-100000 \
            https://services.gradle.org/distributions/gradle-9.3.1-bin.zip \
            || echo "services.gradle.org UNREACHABLE"
          echo "--- cached wrapper dists ---"
          ls -la ~/.gradle/wrapper/dists 2>/dev/null || echo "none cached"

      # Raise the wrapper's network timeout from its 10s default. android/ is
      # regenerated each run, so this has to be patched after prebuild.
      - name: Extend Gradle wrapper network timeout
        working-directory: pulse/app/android/gradle/wrapper
        run: |
          grep -q '^networkTimeout=' gradle-wrapper.properties \
            && sed -i 's/^networkTimeout=.*/networkTimeout=120000/' gradle-wrapper.properties \
            || echo 'networkTimeout=120000' >> gradle-wrapper.properties
          cat gradle-wrapper.properties

      # Release builds are signed with the debug keystore Expo generates, which
      # is enough to sideload. It is NOT suitable for Play Store distribution —
      # that needs a real upload key.
      # Tries the wrapper first (correct version by definition). If it still
      # cannot fetch its distribution, falls back to the Gradle preinstalled on
      # the runner rather than failing the whole build on a network problem.
      - name: Build release APK
        working-directory: pulse/app/android
        run: |
          set -o pipefail
          chmod +x ./gradlew

          ARGS="assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a,armeabi-v7a"

          if ./gradlew $ARGS 2>&1 | tail -80; then
            echo "Built via Gradle wrapper."
            exit 0
          fi

          echo "::warning::Gradle wrapper failed; retrying with the runner's preinstalled Gradle."
          if ! command -v gradle >/dev/null; then
            echo "::error::No preinstalled Gradle to fall back to."
            exit 1
          fi
          gradle $ARGS 2>&1 | tail -80

      - name: Report APK size
        working-directory: pulse/app/android
        run: ls -lh app/build/outputs/apk/release/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pulse-apk
          path: pulse/app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
